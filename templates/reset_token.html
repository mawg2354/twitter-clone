{% extends 'base.html' %}

{% block guest_content %}
<div class="auth-wrapper reset-token">
    <div class="auth-card glass-panel">
        <h2>Set New Password</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Please enter your new password below.</p>
        <form method="POST">
            <div class="form-group" style="position: relative;">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" minlength="6" required placeholder="New password" style="padding-right: 40px;">
                <button type="button" onclick="togglePassword('password')" class="btn-clear" style="position: absolute; right: 10px; top: 32px; padding: 0; font-size: 1.2rem;" title="Show Password">👁️</button>
            </div>
            <div class="form-group" style="position: relative;">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required placeholder="Confirm new password" style="padding-right: 40px;">
                <button type="button" onclick="togglePassword('confirm_password')" class="btn-clear" style="position: absolute; right: 10px; top: 32px; padding: 0; font-size: 1.2rem;" title="Show Password">👁️</button>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
