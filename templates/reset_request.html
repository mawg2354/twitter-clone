{% extends 'base.html' %}

{% block guest_content %}
<div class="auth-wrapper reset-request">
    <div class="auth-card glass-panel">
        <h2>Reset Password</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Enter your email address and we will send you a link to reset your password.</p>
        <form method="POST" action="{{ url_for('reset_request') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>
        <p class="auth-footer">Remembered your password? <a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</div>
{% endblock %}
