{% extends 'base.html' %}

{% block guest_content %}
<div class="auth-wrapper login-page">
    <div class="auth-card glass-panel">
        <h2>Log in to TwiXa</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group" style="position: relative;">
                <div style="display: flex; justify-content: space-between; align-items: baseline;">
                    <label for="password">Password</label>
                    <a href="{{ url_for('reset_request') }}" class="forgot-link">Forgot Password?</a>
                </div>
                <input type="password" id="password" name="password" required placeholder="Enter your password" style="padding-right: 40px;">
                <button type="button" onclick="togglePassword('password')" class="btn-clear" style="position: absolute; right: 10px; top: 32px; padding: 0; font-size: 1.2rem;" title="Show Password">👁️</button>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
            <div style="text-align: center; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.9rem; position: relative;">
                <span style="background: var(--bg-color); padding: 0 0.5rem; position: relative; z-index: 1;">OR</span>
                <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--border); z-index: 0;"></div>
            </div>
            <a href="#" class="btn btn-outline btn-block" style="display: flex; justify-content: center; align-items: center; gap: 0.5rem; text-decoration: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </a>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
    </div>
</div>
{% endblock %}
